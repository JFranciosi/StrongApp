<div class="antigravity-list">
    <div-glass variant="surface">
        <div style="padding: 1.5rem; display: flex; flex-direction: column; gap: 2rem;">
            <div class="header">
                <button class="icon-btn back-btn" (click)="goBack()" aria-label="Go back">
                    <lucide-icon name="arrow-left" size="24"></lucide-icon>
                </button>
                <h1 class="page-title">NEW WORKOUT</h1>
                <div style="width: 40px;"></div>
            </div>

            <!-- Name Input -->
            <div class="input-section">
                <input type="text" class="plasma-input title-input" placeholder="WORKOUT NAME" [ngModel]="workoutName()"
                    (ngModelChange)="workoutName.set($event)" aria-label="Workout Name">
            </div>

            <!-- Date Input -->
            <div class="input-section">
                <input type="datetime-local" class="plasma-input title-input" [ngModel]="workoutDate()"
                    (ngModelChange)="workoutDate.set($event)" aria-label="Workout Date" style="font-size: 1rem;">
            </div>

            <!-- Exercises List -->
            <div class="exercises-list">
                @for (ex of addedExercises(); track $index) {
                <div class="exercise-card">
                    <div-glass variant="surface" className="fill-parent">
                        <div class="card-content">
                            <div class="card-header">
                                <span class="ex-name">{{ getExerciseName(ex.exerciseId) }}</span>
                                <button class="remove-btn" (click)="removeExercise($index)"
                                    [attr.aria-label]="'Remove ' + getExerciseName(ex.exerciseId)">
                                    <lucide-icon name="x" size="16"></lucide-icon>
                                </button>
                            </div>

                            <div class="config-grid">
                                <div class="config-item">
                                    <label>SETS</label>
                                    <input type="number" class="plasma-input small" [(ngModel)]="ex.sets"
                                        aria-label="Sets">
                                </div>
                                <div class="config-item">
                                    <label>REPS</label>
                                    <input type="number" class="plasma-input small" [(ngModel)]="ex.reps"
                                        aria-label="Reps">
                                </div>
                                <div class="config-item">
                                    <label>REST</label>
                                    <div class="input-wrapper">
                                        <input type="text" class="plasma-input small" [ngModel]="ex.uiDisplayValue"
                                            (ngModelChange)="updateRestValue($index, $event)"
                                            aria-label="Rest duration">
                                        <button class="unit-toggle-abs" (click)="toggleRestUnit($index)"
                                            aria-label="Toggle rest unit">
                                            {{ ex.uiUnit }}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div-glass>
                </div>
                }
            </div>

            <!-- Add Exercise Trigger -->
            <button class="add-exercise-btn" (click)="toggleSelector()">
                <lucide-icon name="plus" size="20"></lucide-icon>
                ADD EXERCISE
            </button>

            <!-- Save Action -->
            <div class="actions">
                <button class="pill-save" (click)="saveRelay()">
                    <lucide-icon name="check" size="20"></lucide-icon>
                    CREATE WORKOUT
                </button>
            </div>
        </div>
    </div-glass>

    <!-- Exercise Selector Overlay -->
    @if (isSelectorOpen) {
    <div class="selector-overlay">
        <div class="selector-content">
            <div-glass variant="surface">
                <div class="selector-body">
                    <div class="selector-header">
                        <h3>Select Exercise</h3>
                        <button class="close-selector" (click)="toggleSelector()">Close</button>
                    </div>
                    <div class="selector-list">
                        @for (exercise of availableExercises(); track exercise.id) {
                        <div class="selector-item" (click)="addExercise(exercise.id)"
                            (keydown.enter)="addExercise(exercise.id)" (keydown.space)="addExercise(exercise.id)"
                            role="button" tabindex="0" [attr.aria-label]="'Add ' + exercise.name">
                            <span>{{ exercise.name }}</span>
                            <lucide-icon name="plus-circle" size="16"></lucide-icon>
                        </div>
                        }
                    </div>
                </div>
            </div-glass>
        </div>
    </div>
    }

    <app-modal [isOpen]="isAlertOpen" [title]="alertTitle" [message]="alertMessage" [isAlert]="true" confirmText="OK"
        (confirm)="closeAlert()" (cancel)="closeAlert()">
    </app-modal>
</div>
