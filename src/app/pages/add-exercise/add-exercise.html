<div class="main-container">
    <div class="liquid-card concave">
        <div-glass variant="surface">
            <div class="concave-valley">
                <h2 class="page-title">NEW EXERCISE</h2>

                <input type="text" placeholder="EXERCISE NAME" class="plasma-input title-input" [ngModel]="name()"
                    (ngModelChange)="name.set($event)" aria-label="Exercise Name">

                <div class="input-grid">
                    <div class="input-plasma">
                        <label>WEIGHT</label>
                        <input type="number" class="plasma-input" [ngModel]="weight()"
                            (ngModelChange)="weight.set($event)" aria-label="Weight in Kilograms">
                    </div>

                    <div class="signal-line"></div>

                    <div class="input-plasma">
                        <label>REPS</label>
                        <input type="number" class="plasma-input" [ngModel]="reps()" (ngModelChange)="reps.set($event)"
                            aria-label="Repetitions">
                    </div>
                </div>

                <div class="control-pills">
                    <button class="pill-save" (click)="save()">
                        <lucide-icon name="plus" size="20"></lucide-icon>
                        ADD
                    </button>
                    <button class="pill-delete" (click)="back()">
                        <lucide-icon name="x" size="20"></lucide-icon>
                        CLOSE
                    </button>
                </div>

            </div>
        </div-glass>
    </div>
</div>

<app-modal [isOpen]="isAlertOpen" title="Missing Information" [message]="alertMessage" [isAlert]="true" confirmText="OK"
    (confirm)="closeAlert()" (cancel)="closeAlert()">
</app-modal>
